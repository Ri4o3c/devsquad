[project]
name = "devsquad"
version = "0.1.0"
description = "Desktop multi-agent coding workbench — phase 1 skeleton"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "typer>=0.12.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
devsquad = "devsquad.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.isort]
known-first-party = ["devsquad", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"
markers = [
    "student: owner-implemented modules; expected to fail until the TODO is done",
]
