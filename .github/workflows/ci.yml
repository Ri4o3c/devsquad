name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # CI 之前因 runner 缺少 rg 而跳过 rg 路径测试。
      # 安装并验证 ripgrep，确保实际测试 ripgrep 召回路径。
      - name: Install ripgrep on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install ripgrep on Windows
        if: runner.os == 'Windows'
        run: choco install ripgrep -y
      - name: Verify ripgrep
        run: rg --version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        working-directory: backend
        run: ruff check .
      - name: Pytest
        working-directory: backend
        run: pytest
