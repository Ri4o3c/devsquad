name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        working-directory: backend
        run: ruff check .
      - name: Pytest
        working-directory: backend
        run: pytest
